---
- name: Deploy Primary PostgreSQL Database
  hosts: db
  become: yes
  tasks:
    - name: Install PostgreSQL 17 and dependencies
      package:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present

    - name: Initialize PostgreSQL database
      command: postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/postgresql.conf

    - name: Copy PostgreSQL configuration
      copy:
        src: postgresql.conf
        dest: /var/lib/pgsql/data/postgresql.conf
        owner: postgres
        group: postgres
        mode: '0600'

    - name: Copy pg_hba.conf
      copy:
        src: pg_hba.conf
        dest: /var/lib/pgsql/data/pg_hba.conf
        owner: postgres
        group: postgres
        mode: '0600'

    - name: Start and enable PostgreSQL
      service:
        name: postgresql
        state: started
        enabled: yes

    - name: Create replication user
      postgresql_user:
        name: repl_user
        password: repl_password
        role_attr_flags: REPLICATION
      become: yes
      become_user: postgres

- name: Deploy Replica PostgreSQL Database
  hosts: db_repl
  become: yes
  tasks:
    - name: Install PostgreSQL 17 and dependencies
      package:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present

    - name: Stop PostgreSQL service
      service:
        name: postgresql
        state: stopped

    - name: Clear PGDATA directory
      file:
        path: /var/lib/pgsql/data
        state: absent

    - name: Create PGDATA directory
      file:
        path: /var/lib/pgsql/data
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Copy PostgreSQL replica configuration
      copy:
        src: postgresql_repl.conf
        dest: /var/lib/pgsql/data/postgresql.conf
        owner: postgres
        group: postgres
        mode: '0600'

    - name: Initialize replica from primary
      command: >
        pg_basebackup -h 10.0.2.5 -p 5432 
        -U repl_user -D /var/lib/pgsql/data 
        -X stream -P
      environment:
        PGPASSWORD: repl_password
      become: yes
      become_user: postgres

    - name: Start and enable PostgreSQL service
      service:
        name: postgresql
        state: started
        enabled: yes

- name: Deploy Telegram Bot
  hosts: telegram_bot
  become: yes
  tasks:
    - name: Install required packages
      package:
        name:
          - python3
          - python3-pip
          - git
        state: present

    - name: Create bot directory
      file:
        path: /opt/tg_bot
        state: directory
        mode: '0755'

    - name: Clone bot repository
      git:
        repo: "https://github.com/some0person/devops_bot"
        dest: /opt/tg_bot
        version: docker

    - name: Install Python requirements
      pip:
        requirements: /opt/tg_bot/bot/requirements.txt
        state: present

    - name: Copy .env
      copy:
        src: .env
        dest: "/opt/tg_bot/bot"
        owner: ansible
        group: ansible
        mode: "0644"

    - name: Start and enable bot service
      shell: |
        python3 /opt/tg_bot/bot/main.py &
      args:
        executable: /bin/bash