# Connection settings
listen_addresses = '*'
port = 5432

# Replication settings
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on

# Memory settings
shared_buffers = 128MB
work_mem = 4MB

# Logging
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_replication_commands = on
log_line_prefix = '%m [%p] %u '

# Standby settings
primary_conninfo = 'host=10.0.2.5 port=5432 user=repl_user password=repl_password'
restore_command = 'cp /var/lib/postgresql/data/pg_wal/%f %p'
standby_mode = on 